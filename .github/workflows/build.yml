name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
        working-directory: rust
      - name: Build (release)
        run: cargo build --release
        working-directory: rust
      - name: CLI smoke test
        run: cargo run -- version && cargo run -- dissect hex:474554202f70696e6720485454502f312e310d0a486f73743a20636c69656e7462702e6767706f6c6172626561722e636f6d0d0a0d0a
        working-directory: rust

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust
    env:
      ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        id: ndk
        with:
          ndk-version: '27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build native libraries
        run: ./android/build-native.sh
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle assembleDebug
        working-directory: android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tunlens-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
