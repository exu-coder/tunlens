[package]
name = "tunlens"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only packet observer for apps you own: VpnService tun -> SOCKS5 -> protocol dissection"
license = "MIT"

[lib]
name = "tunlens"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tunlens"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
jni = "0.21"
libc = "0.2"
smoltcp = { version = "0.10", default-features = false, features = [
  "std",
  "medium-ip",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
